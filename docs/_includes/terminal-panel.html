<section class="panel needs-js" id="terminal-panel" aria-label="Terminal">
  <div class="panel-header">
    <span class="panel-tab">Terminal</span>
    <span class="panel-hint">Type <code>help</code> to see what you can run</span>
    <div class="panel-actions">
      <button type="button" class="icon-btn" id="clear-terminal-btn" aria-label="Clear terminal" title="Clear terminal">{% include icon.html name="trash-2" %}</button>
      <button type="button" class="icon-btn" id="close-terminal-btn" aria-label="Close terminal" title="Close panel">{% include icon.html name="x" %}</button>
    </div>
  </div>
  <div class="terminal-body" id="terminal-body" role="log">
    <div class="terminal-line terminal-input-line" id="terminal-input-line">
      <label class="terminal-prompt" for="terminal-input">durganshu@dev:~$</label>
      <input type="text" class="terminal-input" id="terminal-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    </div>
  </div>
</section>
