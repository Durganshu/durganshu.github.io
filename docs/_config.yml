# Site settings for durganshu.com (built by GitHub Pages from /docs).
# This file is not reloaded by `jekyll serve`; restart the server after editing it.

title: Durganshu Mishra
tagline: C++ Software Developer
description: >-
  C++ Software Developer at Teledyne SevenCs in Hamburg, working on high-performance computing,
  GPU programming and scientific computing. Projects, publications and articles.
url: https://durganshu.com
baseurl: ""
lang: en_US

author:
  name: Durganshu Mishra
  url: https://durganshu.com
  twitter: mdurganshu

twitter:
  username: mdurganshu
  card: summary_large_image

social:
  name: Durganshu Mishra
  links:
    - https://github.com/durganshu
    - https://www.linkedin.com/in/durganshu
    - https://medium.com/@durganshu
    - https://hackernoon.com/about/durganshu

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
    values:
      image: /images/og-card.png
  - scope:
      path: ""
      type: posts
    values:
      # Updates live at /updates/<name>/; old /jekyll/update/... URLs redirect via redirect_from.
      permalink: /updates/:title/
      layout: post
      nav_key: updates
  - scope:
      path: google8def1d34ccd23a22.html
    values:
      sitemap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache
